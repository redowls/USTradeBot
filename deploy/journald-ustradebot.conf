# Log rotation for the VPS (Phase 10). The bot logs to journald (no log files), so
# "rotation" = capping journald's on-disk size + retention. Install with:
#
#   sudo cp deploy/journald-ustradebot.conf /etc/systemd/journald.conf.d/ustradebot.conf
#   sudo systemctl restart systemd-journald
#
# Note: journald is system-wide (these limits apply to the whole journal, not just
# ustradebot) — fine for a single-purpose VPS.

[Journal]
SystemMaxUse=500M
MaxRetentionSec=1month
